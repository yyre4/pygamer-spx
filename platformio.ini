[platformio]
src_dir = pygamer_spx

[env:adafruit_pygamer_m4]
platform = atmelsam
board = adafruit_pygamer_m4
framework = arduino
; TinyUSB stack is required by Arcada 2.5.x AND by USB MIDI
; (IDE equivalent: Tools -> USB Stack -> TinyUSB)
; The -I works around the known PlatformIO/SAMD quirk where the SPI
; include path gets dropped over a circular-dependency warning between
; SPI and the TinyUSB library (same fix the FlyBrain build needed).
build_flags =
    -DUSE_TINYUSB
    -I${platformio.packages_dir}/framework-arduino-samd-adafruit/libraries/SPI
lib_deps =
    adafruit/Adafruit Arcada Library@^2.5.10
    SPI
    Wire
monitor_speed = 115200
